buildscript {
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		// Das Android-Gradle-Plugin, das Gradle beibringt, wie man Android-APKs baut
		classpath 'com.android.tools.build:gradle:8.11.2'
	}
}

apply plugin: 'com.android.application'

android {
	// Hier den Package-Namen aus Ihrer AndroidManifest.xml eintragen:
	namespace 'at.gaeckler.FotoCalc.android'

	compileSdk 36

	defaultConfig {
		applicationId "at.gaeckler.FotoCalc"
		// 23: Android 6 - Technisches Minimum (AppCompat/MultiDex).
		// 26: Android 8 - kleinste APK-Größe wegen fehlenden Legacy Support-Funktionen.
		// 28: Android 9 - APK wird größer (unkomprimierte native Libs), dafür schnellerer Start & weniger RAM-Verbrauch.
		minSdk 28
		targetSdk 36
		versionCode 14
		versionName "3.8.17"
		resValue "string", "app_version", "\"${versionName}\""
	}

    sourceSets {
        main {
            // Sagt Gradle, dass die Dateiverzeichnisse aus dem alten ADT-Layout stammen:
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }
    buildTypes {
        release {
            minifyEnabled true      // Entfernt nicht genutzten Code/Klassen aus Bibliotheken
            shrinkResources true    // Wirft ungenutzte XMLs, Layouts & Bilder aus den Libs heraus
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    defaultConfig {
        // Behält NUR Deutsch (und ggf. Englisch) aus eingebundenen Bibliotheken
        resConfigs "de", "en"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
